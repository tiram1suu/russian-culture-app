<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин RCC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .shop-page { background: var(--dark-bg); min-height: 100vh; color: white; padding: 20px; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .shop-header h2 { font-size: 1.5rem; }
        .coins-balance { background: #1f1f1f; padding: 10px 15px; border-radius: 10px; color: #ffd700; font-weight: bold; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { background: #1f1f1f; border-radius: 12px; padding: 15px; text-align: center; }
        .shop-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .shop-item h3 { font-size: 1rem; margin: 5px 0; }
        .shop-item p { color: #888; font-size: 0.8rem; margin: 5px 0; }
        .shop-item .price { color: #ffd700; font-weight: bold; font-size: 1.1rem; }
        .btn-buy { background: var(--primary-red); color: white; border: none; padding: 8px 16px; border-radius: 20px; margin-top: 10px; cursor: pointer; width: 100%; }
        .btn-buy:disabled { background: #555; opacity: 0.6; cursor: default; }
        .btn-buy.purchased { background: #2a2a2a; color: #888; }
    </style>
</head>
<body>

<div class="shop-page">
    <div class="shop-header">
        <h2>🎁 Магазин</h2>
        <div class="coins-balance">🪙 <span id="shop-coins">0</span></div>
    </div>

    <div id="shop-container" class="shop-grid">
        
    </div>
</div>


<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Главная</a>
    <a href="events.html" class="nav-item"><i class="fas fa-calendar-alt"></i> События</a>
    <a href="shop.html" class="nav-item active"><i class="fas fa-shopping-bag"></i> Магазин</a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Профиль</a>
</nav>

<script src="js/shop.js"></script>
</body>
</html>
