<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="profile-page">

    <div class="profile-header">
        <h2>ПРОФИЛЬ</h2>
        <i class="fas fa-cog"></i>
    </div>

    <div class="profile-avatar" id="tg-avatar"></div>
    <div class="profile-username" id="tg-username">Загрузка...</div>
    <div class="profile-role">Участник</div>

    <div class="coins-box">
        <div class="coins-label">
            <span class="coin-icon">🪙</span>
            <span>МОНЕТ</span>
        </div>
        <div class="coins-value" id="coins-count">0</div>
    </div>

    <h3 style="text-align: left; margin-bottom: 15px; font-size: 1rem; color: #888;">МОИ ДОСТИЖЕНИЯ</h3>
    <div id="achievements-container">
        <!-- Achievements loaded by JS -->
    </div>
    
    <div style="margin-top: 20px; padding: 15px; background: #1f1f1f; border-radius: 10px;">
        <h3 style="color: #aaa; font-size: 0.9rem;">Посещено событий: <span id="events-count" style="color:white;">0</span></h3>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Главная</a>
        <a href="events.html" class="nav-item"><i class="fas fa-calendar-alt"></i> События</a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i> Профиль</a>
    </nav>

    <script src="js/profile.js"></script>
</body>
</html>
