<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐔 Петушиный кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            width: 100%;
            max-width: 400px;
            background: #16213e;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }
        #scoreLabel {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #clicker {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }
        #clicker:active {
            transform: scale(0.9);
        }
        #clicker img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        #clicker img:hover {
            filter: brightness(1.1);
        }
        #clickCount {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        #resetBtn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        #resetBtn:hover {
            background: #c73652;
        }
        /* Анимация всплытия +1 */
        .float-text {
            position: fixed;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
        .sound-toggle {
            margin-top: 10px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }
        .sound-toggle:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="scoreLabel">🐔 ОЧКИ</div>
    <div id="score">0</div>

    <div id="clicker">
        <!-- Пиксельный петух (SVG) -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Тело -->
            <ellipse cx="50" cy="65" rx="30" ry="25" fill="#FF6B35"/>
            <!-- Голова -->
            <circle cx="50" cy="35" r="20" fill="#FF6B35"/>
            <!-- Гребень -->
            <path d="M40 15 Q45 5 50 15 Q55 5 60 15" fill="#FF0000" stroke="#FF0000" stroke-width="2"/>
            <!-- Клюв -->
            <path d="M65 35 L80 38 L65 42 Z" fill="#FFA500"/>
            <!-- Глаз -->
            <circle cx="55" cy="32" r="4" fill="#000"/>
            <!-- Крыло -->
            <ellipse cx="40" cy="60" rx="15" ry="12" fill="#E85D2C"/>
            <!-- Хвост -->
            <path d="M20 50 Q5 45 10 35 Q15 50 20 50" fill="#E85D2C"/>
            <path d="M20 55 Q0 55 5 40 Q10 55 20 55" fill="#D94F1A"/>
            <!-- Ноги -->
            <line x1="40" y1="85" x2="35" y2="95" stroke="#FFA500" stroke-width="3"/>
            <line x1="55" y1="85" x2="60" y2="95" stroke="#FFA500" stroke-width="3"/>
        </svg>
    </div>

    <div id="clickCount">👆 Нажми на петуха</div>

    <div class="sound-toggle" id="soundToggle">🔊 Звук: вкл</div>

    <button id="resetBtn">🔄 Сбросить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let score = 0;
    let soundEnabled = true;
    const scoreDisplay = document.getElementById('score');
    const clicker = document.getElementById('clicker');
    const clickCountDisplay = document.getElementById('clickCount');
    const soundToggle = document.getElementById('soundToggle');

    
    const savedScore = localStorage.getItem('clickerScore');
    if (savedScore) {
        score = parseInt(savedScore);
        scoreDisplay.textContent = score;
    }

    
    const savedSound = localStorage.getItem('clickerSound');
    if (savedSound === 'off') {
        soundEnabled = false;
        soundToggle.textContent = '🔇 Звук: выкл';
    }

    
    function playFart() {
        if (!soundEnabled) return;
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            
        }
    }

    
    clicker.addEventListener('click', (e) => {
        
        score += 1;
        scoreDisplay.textContent = score;
        localStorage.setItem('clickerScore', score);

        
        playFart();

        
        const float = document.createElement('div');
        float.className = 'float-text';
        float.textContent = '+1 💨';
        float.style.left = (e.clientX - 20) + 'px';
        float.style.top = (e.clientY - 30) + 'px';
        document.body.appendChild(float);
        setTimeout(() => float.remove(), 800);

        
        clickCountDisplay.textContent = `👆 ${score} кликов`;
    });

    
    soundToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
            soundToggle.textContent = '🔊 Звук: вкл';
            localStorage.setItem('clickerSound', 'on');
        } else {
            soundToggle.textContent = '🔇 Звук: выкл';
            localStorage.setItem('clickerSound', 'off');
        }
    });

    
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('Сбросить счёт?')) {
            score = 0;
            scoreDisplay.textContent = '0';
            localStorage.setItem('clickerScore', '0');
            clickCountDisplay.textContent = '👆 Нажми на петуха';
        }
    });

    
    if (score > 0) {
        clickCountDisplay.textContent = `👆 ${score} кликов`;
    }
</script>

</body>
</html>
