<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Culture Center</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">RUSSIAN CULTURE CENTER</div>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </header>

    <main class="hero-section">
        <div class="hero-title">
            <h1>КУЛЬТУРА.<br>ЛЮДИ.<br><span>ВПЕЧАТЛЕНИЯ.</span></h1>
        </div>
        <p class="hero-desc">
            Современные события, вдохновлённые традициями. Для всех, кто любит культуру, общение и новые впечатления.
        </p>
        
        <a href="events.html" class="btn-primary">
            СМОТРЕТЬ СОБЫТИЯ <i class="fas fa-arrow-right"></i>
        </a>

        <div class="hero-img-wrapper">
            <!-- Using a placeholder or local image -->
            <img src="images/hero.jpg" alt="Culture" onerror="this.src='https://via.placeholder.com/300x400/8b0000/ffffff?text=Culture'">
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-home"></i> Главная</a>
        <a href="events.html" class="nav-item"><i class="fas fa-calendar-alt"></i> События</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Профиль</a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
