<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель RCC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .admin-container { padding: 20px; background: var(--dark-bg); color: white; min-height: 100vh; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .admin-login { max-width: 400px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .admin-login input { padding: 12px; width: 100%; margin-bottom: 15px; border-radius: 8px; border: none; }
        .admin-login button { padding: 12px 30px; background: var(--primary-red); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .admin-form { background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .admin-form input, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; background: #333; color: white; }
        .admin-form label { display: block; margin-bottom: 5px; color: #aaa; }
        .admin-form button { padding: 10px 20px; background: var(--primary-red); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .events-list { margin-top: 20px; }
        .event-item { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .event-item button { background: transparent; border: none; color: var(--primary-red); cursor: pointer; margin-left: 10px; }
        .image-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
        .file-upload { margin: 10px 0; }
        .loading { color: #888; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="app" class="admin-container">
    <div id="login-screen" class="admin-login">
        <h2 style="color:white; margin-bottom: 20px;">🔐 Вход в админ-панель</h2>
        
        <input type="password" id="admin-password" placeholder="Введите пароль">
        
        <input type="password" id="admin-token" placeholder="Введите GitHub токен (один раз)">
        
        <button onclick="checkPassword()">Войти</button>
        
        <p style="color:#888; font-size:0.8rem; margin-top:10px;">
            Токен сохранится в вашем браузере
        </p>
    </div>

    <div id="admin-screen" style="display:none;">
        <div class="admin-header">
            <h2>📋 Управление событиями</h2>
            <button onclick="logout()" style="background:transparent; border:1px solid #555; color:white; padding:5px 15px; border-radius:6px; cursor:pointer;">Выйти</button>
        </div>

        
        <div id="form-container" class="admin-form">
            <h3 id="form-title">➕ Добавить событие</h3>
            <input type="hidden" id="edit-id">
            
            <label>Название</label>
            <input type="text" id="edit-title" placeholder="Название события">
            
            <label>Категория</label>
            <input type="text" id="edit-category" placeholder="Кино / Музыка / Язык / Еда">
            
            <label>Дата</label>
            <input type="text" id="edit-date" placeholder="23 мая">
            
            <label>Время</label>
            <input type="text" id="edit-time" placeholder="19:00">
            
            <label>Монеты</label>
            <input type="number" id="edit-coins" placeholder="20">
            
            <label>Ссылка на Яндекс.Форму</label>
            <input type="text" id="edit-form-link" placeholder="https://forms.yandex.ru/...">
            
            <label>Картинка</label>
            <div class="file-upload">
                <input type="file" id="edit-image" accept="image/*">
                <div id="image-preview-container"></div>
            </div>

            <button onclick="saveEvent()">💾 Сохранить</button>
            <button onclick="cancelEdit()" style="background:#555; margin-left:10px;">Отмена</button>
        </div>

        <div id="events-list" class="events-list">
            <h3>📌 Список событий</h3>
            <div id="events-container-admin"></div>
        </div>

        
        <div style="margin-top: 30px;">
            <hr style="border-color: #333;">
            <h3>🎁 Управление магазином</h3>
            <button onclick="showShopForm()" style="background: #ffd700; color: black; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 10px;">
                + Добавить товар
            </button>
        </div>

        <div id="shop-admin-form" class="admin-form" style="display:none;">
            <h3 id="shop-form-title">➕ Добавить товар</h3>
            <input type="hidden" id="shop-edit-id">
            <label>Название</label>
            <input type="text" id="shop-edit-title" placeholder="Название товара">
            <label>Описание</label>
            <input type="text" id="shop-edit-description" placeholder="Описание товара">
            <label>Цена (монеты)</label>
            <input type="number" id="shop-edit-price" placeholder="50">
            <label>Количество (лимит)</label>
            <input type="number" id="shop-edit-limit" placeholder="Например, 3 (0 = без лимита)">
            <label>Картинка</label>
            <input type="file" id="shop-edit-image" accept="image/*">
            <div id="shop-image-preview"></div>
            <button onclick="saveShopItem()">💾 Сохранить товар</button>
            <button onclick="cancelShopEdit()" style="background:#555; margin-left:10px;">Отмена</button>
        </div>

        <div id="shop-items-list" class="events-list">
            <h3>📦 Список товаров</h3>
            <div id="shop-items-container"></div>
        </div>

        
        <div style="margin-top: 30px;">
            <hr style="border-color: #333;">
            <h3>📊 История покупок</h3>
            <button onclick="loadPurchases()" style="background: #4a9eff; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
                Обновить
            </button>
            <div id="purchases-container" style="margin-top: 10px;"></div>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
