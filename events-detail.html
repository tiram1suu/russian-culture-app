<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Детали события</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #111; color: white;">

    <div class="detail-container">
        <div style="margin-bottom: 15px;"><a href="events.html" style="color:white; text-decoration:none;"><i class="fas fa-arrow-left"></i> Назад</a></div>

        <div id="detail-content">
            <h2>Загрузка...</h2>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = parseInt(urlParams.get('id'));

            
            try {
                const response = await fetch('data/events.json');
                const events = await response.json();
                const event = events.find(e => e.id === eventId);

                if (!event) {
                    document.getElementById('detail-content').innerHTML = '<p>Событие не найдено</p>';
                    return;
                }

                const container = document.getElementById('detail-content');
                container.innerHTML = `
                    <img src="${event.image}" class="detail-img" onerror="this.src='https://via.placeholder.com/400x200'">
                    <h1>${event.title}</h1>
                    <div style="display:flex; gap:10px; margin:10px 0; color:#888; font-size:0.9rem;">
                        <span>📅 ${event.date}</span>
                        <span>⏰ ${event.time}</span>
                    </div>
                    <p style="color:#ddd; line-height:1.5;">${event.description || 'Описание события...'}</p>
                    <div style="margin: 20px 0; color:#ffd700;">+ ${event.coins} монет за посещение</div>
                    
                    <button class="btn-join" onclick="joinEvent(${event.id}, ${event.coins}, '${event.form_link}')">Я ИДУ</button>
                `;
            } catch (error) {
                console.error('Ошибка загрузки события:', error);
                document.getElementById('detail-content').innerHTML = '<p style="color:red;">Ошибка загрузки</p>';
            }
        });

        function joinEvent(id, coins, formLink) {
            
            let userData = JSON.parse(localStorage.getItem('russianCultureUser')) || { eventsAttended: [], totalCoins: 0 };
            
            if (userData.eventsAttended.includes(id)) {
                tg.showAlert("Вы уже записаны на это событие!");
                return;
            }

            
            userData.eventsAttended.push(id);
            userData.totalCoins += coins;
            localStorage.setItem('russianCultureUser', JSON.stringify(userData));

            
            tg.openLink(formLink);

            
            tg.showAlert(`Вы записаны! +${coins} монет. Всего: ${userData.totalCoins}\nТеперь заполните форму.`);
        }
    </script>
</body>
</html>
